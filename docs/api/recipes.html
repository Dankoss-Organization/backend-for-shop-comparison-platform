<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes API | Shop Comparison Platform</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; color: #0f172a; background: #f8fafc; }
      .container { max-width: 920px; margin: 0 auto; padding: 44px 20px 56px; }
      .topbar { margin-bottom: 20px; }
      .topbar a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
      .topbar a:hover { text-decoration: underline; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); }
      .subtitle { margin-top: 10px; color: #334155; line-height: 1.6; font-size: 17px; }
      .panel { margin-top: 22px; padding: 22px; border: 1px solid #cbd5e1; border-radius: 14px; background: #fff; }
      .panel h2 { margin: 0 0 10px; font-size: 22px; }
      li, p { color: #334155; line-height: 1.6; }
      ul { margin: 10px 0 0; padding-left: 20px; }
      code { font-family: Consolas, "Courier New", monospace; }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar"><a href="./reference.html">Back to API reference</a></div>
      <h1>Recipes</h1>
      <p class="subtitle">Recipe catalog endpoints for listing, details, categories, and related recipes.</p>
      <section class="panel">
        <h2>Endpoints</h2>
        <ul>
          <li><code>GET /api/v1/recipes</code></li>
          <li><code>GET /api/v1/recipes/categories</code></li>
          <li><code>GET /api/v1/recipes/:id/related</code></li>
          <li><code>GET /api/v1/recipes/:id</code></li>
        </ul>
      </section>
    </main>
  </body>
</html>
