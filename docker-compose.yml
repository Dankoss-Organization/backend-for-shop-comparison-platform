services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shop-comparison-backend:latest
    command: npm run start:prod
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    labels:
      - "app=shop-comparison"
      - "service=api"

  worker:
    image: shop-comparison-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:worker:prod
    env_file:
      - .env
    labels:
      - "app=shop-comparison"
      - "service=worker"

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy
    env_file:
      - .env
    depends_on:
      - api
      - worker
    restart: unless-stopped
