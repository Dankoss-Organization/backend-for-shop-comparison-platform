services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shop-comparison-backend:latest
    command: npm run start:prod
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

  worker:
    image: shop-comparison-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:worker:prod
    env_file:
      - .env